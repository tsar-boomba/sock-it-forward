[package]
name = "sock-it-forward"
version = "0.1.0"
edition = "2024"

[dependencies]
iroh = "1.0.3"
color-eyre = "0.6.5"
num_cpus = "1.17.0"
tokio = { version = "1.53.1", features = ["macros", "net", "parking_lot", "rt", "sync"] }
arc-swap = "1.9.2"
proxy-protocol = "0.5.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.4", features = ["derive"] }
futures-util = "0.3.33"
